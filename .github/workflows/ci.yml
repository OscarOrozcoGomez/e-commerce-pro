name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (PHPUnit)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run unit tests
        env:
          APP_ENV: qa
          DB_HOST: 127.0.0.1
          DB_NAME: test_db
          DB_USER: root
          DB_PASSWORD: ""
          DB_CHARSET: utf8mb4
        run: composer test

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Import base schema (database.sql)
        run: mysql -h 127.0.0.1 -u root test_db < database.sql

      - name: Run database migrations
        env:
          APP_ENV: qa
          DB_HOST: 127.0.0.1
          DB_NAME: test_db
          DB_USER: root
          DB_PASSWORD: ""
          DB_CHARSET: utf8mb4
        run: php scripts/migrate.php

      - name: Seed E2E test data
        env:
          APP_ENV: qa
          DB_HOST: 127.0.0.1
          DB_NAME: test_db
          DB_USER: root
          DB_PASSWORD: ""
          DB_CHARSET: utf8mb4
        run: php scripts/seed_e2e_test_data.php

      - name: Seed E2E staff accounts
        env:
          APP_ENV: qa
          DB_HOST: 127.0.0.1
          DB_NAME: test_db
          DB_USER: root
          DB_PASSWORD: ""
          DB_CHARSET: utf8mb4
        run: php scripts/seed_e2e_staff_accounts.php

      - name: Start PHP built-in server
        env:
          APP_ENV: qa
          DB_HOST: 127.0.0.1
          DB_NAME: test_db
          DB_USER: root
          DB_PASSWORD: ""
          DB_CHARSET: utf8mb4
        run: php -S 127.0.0.1:8000 -t . &

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          BASE_URL: http://127.0.0.1:8000/
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
