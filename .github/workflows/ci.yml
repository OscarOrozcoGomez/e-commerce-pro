name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (PHPUnit)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run unit tests
        env:
          APP_ENV: qa
          DB_HOST: 127.0.0.1
          DB_NAME: test_db
          DB_USER: root
          DB_PASSWORD: ""
          DB_CHARSET: utf8mb4
        run: composer test

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      # database.sql trae su propio "CREATE DATABASE IF NOT EXISTS beautyandwell_prod; USE
      # beautyandwell_prod;" al principio -- si el servicio de MySQL crea una BD con otro
      # nombre (p.ej. "test_db"), ese USE la ignora por completo y todas las tablas del
      # schema terminan creandose en beautyandwell_prod en vez de en la BD que le pasamos a
      # `mysql` en la linea de importacion, dejando esa otra BD vacia (asi fallo la primera
      # corrida de este job: "Table 'test_db.clientes' doesn't exist"). Se usa el mismo
      # nombre que trae el dump para que ambos coincidan.
      #
      # Imagen mariadb (no mysql): la app corre sobre MariaDB en local (XAMPP) y en
      # produccion -- nunca sobre MySQL real. Usar `mysql:8.0` aqui rompio la segunda
      # corrida de este job: database/migrations/20260702_000003_...sql usa
      # "ADD COLUMN IF NOT EXISTS ... AFTER col", sintaxis que MariaDB soporta desde hace
      # anios pero que el parser de MySQL 8 rechazo. Esa migracion ya esta aplicada en BDs
      # reales (checksum fijo, no se puede editar -- ver migrate.php), asi que el fix
      # correcto es que CI use el mismo motor que el resto del proyecto, no reescribir la
      # migracion.
      mysql:
        image: mariadb:10.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: beautyandwell_prod
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Import base schema (database.sql)
        run: mysql -h 127.0.0.1 -u root beautyandwell_prod < database.sql

      - name: Run database migrations
        env:
          APP_ENV: qa
          DB_HOST: 127.0.0.1
          DB_NAME: beautyandwell_prod
          DB_USER: root
          DB_PASSWORD: ""
          DB_CHARSET: utf8mb4
        run: php scripts/migrate.php

      - name: Seed E2E test data
        env:
          APP_ENV: qa
          DB_HOST: 127.0.0.1
          DB_NAME: beautyandwell_prod
          DB_USER: root
          DB_PASSWORD: ""
          DB_CHARSET: utf8mb4
        run: php scripts/seed_e2e_test_data.php

      - name: Seed E2E staff accounts
        env:
          APP_ENV: qa
          DB_HOST: 127.0.0.1
          DB_NAME: beautyandwell_prod
          DB_USER: root
          DB_PASSWORD: ""
          DB_CHARSET: utf8mb4
        run: php scripts/seed_e2e_staff_accounts.php

      - name: Start PHP built-in server
        env:
          APP_ENV: qa
          DB_HOST: 127.0.0.1
          DB_NAME: beautyandwell_prod
          DB_USER: root
          DB_PASSWORD: ""
          DB_CHARSET: utf8mb4
          # A diferencia de XAMPP local (htdocs/e-commerce-pro/), este server sirve el repo
          # directo en la raiz -- sin este override, core/config.php detectaria "127.0.0.1" y
          # asumiria la subcarpeta /e-commerce-pro/ para cada link/redirect, todos 404eando.
          APP_BASE_URL: /
          # `php -S` sin esto atiende un request a la vez (de verdad, no solo "lento") --
          # Playwright corre con workers:2 en CI (mas retries:2 sobre cualquier timeout),
          # asi que sin concurrencia real cada request se encola detras del anterior y el
          # job termina tardando muchisimo mas que localmente contra Apache (que si maneja
          # requests en paralelo). PHP_CLI_SERVER_WORKERS (soportado desde PHP 7.4) hace que
          # el server integrado pre-forkee varios procesos para atender requests en paralelo.
          PHP_CLI_SERVER_WORKERS: 4
        run: php -S 127.0.0.1:8000 -t . &

      # Diagnostico temporal: el job de E2E ha estado colgandose ~30s en practicamente cada
      # navegacion (page.waitForURL/goto nunca resuelven), incluso en paginas sin login ni
      # llamadas externas -- sin reproducirse igual localmente. Antes de gastar otra corrida
      # completa de Playwright (10-70+ min) adivinando la causa, esto mide en segundos si el
      # server integrado esta sirviendo requests en paralelo de verdad (PHP_CLI_SERVER_WORKERS)
      # o si se estan encolando uno detras de otro.
      - name: Diagnostico -- pcntl, concurrencia real de php -S, y CDNs externos que carga cada pagina
        run: |
          echo "--- pcntl cargado? ---"
          php -m | grep -i pcntl || echo "pcntl NO esta en la lista de modulos"
          sleep 1
          echo "--- 1 request simple al server local (baseline) ---"
          time curl -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:8000/views/login.php
          echo "--- 4 requests concurrentes al server local (si el total es ~4x el baseline, se estan encolando) ---"
          time (curl -s -o /dev/null http://127.0.0.1:8000/views/login.php & curl -s -o /dev/null http://127.0.0.1:8000/views/login.php & curl -s -o /dev/null http://127.0.0.1:8000/views/login.php & curl -s -o /dev/null http://127.0.0.1:8000/views/login.php & wait)
          echo "--- CDNs externos que cada pagina carga sin condicion (resultado descartaria/confirmaria un recurso externo colgado, ya que el server local resulto no ser el cuello de botella) ---"
          for url in \
            "https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" \
            "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" \
            "https://www.googletagmanager.com/gtm.js?id=GTM-TPZG9NDT" \
            "https://fonts.googleapis.com/icon?family=Material+Icons" \
            "https://static.cloudflareinsights.com/beacon.min.js"; do
            echo "-> $url"
            curl -s -o /dev/null --max-time 10 -w "  namelookup=%{time_namelookup}s connect=%{time_connect}s total=%{time_total}s HTTP=%{http_code}\n" "$url" || echo "  FALLO/TIMEOUT (>10s)"
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Diagnostico temporal: los descartes anteriores (server local, CDNs externos) dejan
      # como sospechoso mas probable algo dentro del propio navegador (sandbox de Chromium en
      # el runner/contenedor de GitHub Actions es la causa mas comun y conocida de este patron
      # exacto -- page.goto/waitForURL colgandose sin error, en vez de fallar rapido). Corre
      # UN solo test simple (pagina publica, sin login) con logging verboso de Playwright en
      # vez de las 128 pruebas, para dar una senal en segundos/1 minuto en vez de esperar otra
      # hora completa adivinando.
      - name: Diagnostico -- 1 test simple con logging verboso del navegador
        env:
          BASE_URL: http://127.0.0.1:8000/
          DEBUG: pw:browser,pw:api
        run: npx playwright test catalog-product-detail.spec.ts --workers=1 --retries=0 --timeout=15000 --reporter=list

      # Diagnostico temporal: catalogo.php atrapa PDOException de su query principal y la
      # deja muda (solo error_log(), $productos = []) -- el test de arriba fallo porque el
      # catalogo salio vacio SIN colgarse (page.goto/load resolvieron normal), asi que el
      # sospechoso real es un error SQL en esa query, no un cuelgue de red/navegador. Este
      # error_log() cae en app_error.log (ver core/config.php), no en el stdout de este job.
      - name: Diagnostico -- contenido de app_error.log
        if: always()
        run: |
          if [ -f app_error.log ]; then
            echo "--- app_error.log ---"
            cat app_error.log
          else
            echo "app_error.log no existe (no se registro ningun error via error_log)"
          fi

      - name: Run Playwright tests
        if: false # deshabilitado temporalmente mientras se diagnostica el cuelgue de arriba
        env:
          BASE_URL: http://127.0.0.1:8000/
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
