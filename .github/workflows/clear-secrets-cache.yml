name: Limpiar Cache de Secretos (GSM)

# Manual unicamente: los secretos de Google Secret Manager se cachean en produccion
# hasta por GSM_CACHE_TTL_SECONDS (7 dias por defecto) en 3 capas -- sesion PHP, APCu y
# archivo (ver api/clear_secrets_cache.php). Cuando se rota un secreto (ej.
# FB_PAGE_ACCESS_TOKEN) hay que disparar esto para que las sesiones ya abiertas dejen de
# servir el valor viejo, en vez de esperar a que expire solo.
on:
  workflow_dispatch:

jobs:
  clear-cache:
    name: Invalidar cache de secretos en produccion
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Derivar URL del endpoint desde MIGRATIONS_URL
        env:
          MIGRATIONS_URL: ${{ secrets.MIGRATIONS_URL }}
        run: |
          if [ -z "$MIGRATIONS_URL" ]; then
            echo "::error::Falta el secreto MIGRATIONS_URL"
            exit 1
          fi
          # MIGRATIONS_URL = https://dominio.com/api/run_migrations.php -> mismo directorio,
          # api/clear_secrets_cache.php (ver DEPLOY_ENVIRONMENTS_SETUP.md).
          CLEAR_CACHE_URL="${MIGRATIONS_URL%/*}/clear_secrets_cache.php"
          echo "CLEAR_CACHE_URL=$CLEAR_CACHE_URL" >> "$GITHUB_ENV"

      - name: Limpiar cache de secretos
        env:
          MIGRATIONS_DEPLOY_TOKEN: ${{ secrets.MIGRATIONS_DEPLOY_TOKEN }}
        run: |
          body_file="$RUNNER_TEMP/clear_cache_response.json"
          http_code=$(curl -sS \
            --connect-timeout 30 \
            --max-time 60 \
            -o "$body_file" \
            -w '%{http_code}' \
            -X POST "$CLEAR_CACHE_URL" \
            -H "X-Migrations-Token: $MIGRATIONS_DEPLOY_TOKEN")
          response=$(cat "$body_file" 2>/dev/null || echo "")

          echo "Respuesta (HTTP $http_code):"
          echo "$response"

          if [ "$http_code" != "200" ] || ! echo "$response" | grep -q '"success"[[:space:]]*:[[:space:]]*true'; then
            echo "::error::No se pudo limpiar el cache de secretos (HTTP $http_code)"
            exit 1
          fi

          echo "::notice::Cache de secretos invalidado correctamente en produccion."

          # El endpoint recarga los secretos tras limpiar y reporta cuales quedaron
          # disponibles (solo presencia, sin valores). Lo mostramos aqui para confirmar
          # de un vistazo si Facebook quedo configurado sin abrir la vista del repartidor.
          if command -v jq >/dev/null 2>&1 && echo "$response" | jq -e . >/dev/null 2>&1; then
            echo "Secretos presentes tras la recarga:"
            echo "$response" | jq -r '.limpiado.secretos_presentes | to_entries[] | "  \(.key): \(.value)"'

            fb=$(echo "$response" | jq -r '.limpiado.facebook_configurado')
            if [ "$fb" = "true" ]; then
              echo "::notice::Facebook configurado: FB_PAGE_ID y FB_PAGE_ACCESS_TOKEN presentes tras la recarga."
            else
              echo "::warning::Facebook NO configurado tras limpiar el cache. Revisa que FB_PAGE_ID y FB_PAGE_ACCESS_TOKEN existan en Secret Manager (mismo proyecto) y que la service account tenga acceso a ambos."
            fi
          fi
