name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (rsync + migraciones) al VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Guard - sin archivos de secretos rastreados
        run: |
          fail=0
          for f in \
            core/app_secrets.php core/app_secrets.production.php core/app_secrets.qa.php \
            core/app_secrets.local.php app_secrets.php .app_secrets.php views/.app_secrets.php
          do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f esta rastreado en git y no debe estarlo"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Setup PHP 8.2 + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: composer install (produccion, sin dev)
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Validar secrets de despliegue
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for k in SSH_HOST SSH_USER SSH_PORT SSH_KEY SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [ -z "${!k}" ]; then echo "::error::Falta secret: $k"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Configurar clave SSH
        env:
          SSH_KEY_RAW: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          KEY="$HOME/.ssh/deploy_key"
          if printf '%s' "$SSH_KEY_RAW" | base64 -d > "$KEY" 2>/dev/null \
             && ssh-keygen -y -f "$KEY" >/dev/null 2>&1; then
            echo "clave SSH: decodificada de base64"
          else
            printf '%s\n' "$SSH_KEY_RAW" > "$KEY"
            echo "clave SSH: tratada como PEM crudo"
          fi
          chmod 600 "$KEY"
          if ! ssh-keygen -y -f "$KEY" >/dev/null 2>&1; then
            echo "::error::SSH_KEY invalida (ni base64 ni PEM validos). Regenera la llave y re-sube el secret."
            exit 1
          fi
          echo "clave SSH valida"

          KH="$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$KH"
          if ssh-keygen -l -f "$KH" >/dev/null 2>&1; then
            echo "known_hosts: desde secret"
          else
            ssh-keyscan -t ed25519,rsa,ecdsa -p "${SSH_PORT}" "${SSH_HOST}" > "$KH" 2>/dev/null
            echo "known_hosts: via ssh-keyscan"
          fi
          chmod 644 "$KH"
          test -s "$KH" || { echo "::error::known_hosts quedo vacio"; exit 1; }

      - name: Rsync al VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -rlptz --delete \
            --exclude-from=deploy-exclude.txt \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${SSH_PORT} -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            ./ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

      - name: Post-deploy en el VPS (permisos + migraciones)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p "${SSH_PORT}" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${SSH_USER}@${SSH_HOST}" "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" < scripts/deploy_remote.sh
